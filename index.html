<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SHPS Flipbooks</title>
    <meta name="description" content="Interactive page-flipping guides from the SHPS ICT Department.">
    <meta name="theme-color" content="#1a252f">

    <!-- Preview card when the link is pasted into Teams, Outlook or WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SHPS Flipbooks">
    <meta property="og:description" content="Interactive page-flipping guides from the SHPS ICT Department.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

    <!-- Speeds up the first connection to the CDN -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- DearFlip is pinned to a fixed version so an upstream release can't break the site overnight -->
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/themify-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="controls">
            <label for="book-selector" class="visually-hidden">Choose a book</label>
            <select id="book-selector" disabled>
                <option value="">Loading books…</option>
            </select>

            <button id="share-btn" class="icon-btn" type="button" title="Copy a link to this page" aria-label="Copy a link to this page" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a3 3 0 1 1 4.2 4.2l-1.8 1.8a1 1 0 1 1-1.4-1.4l1.8-1.8a1 1 0 1 0-1.4-1.4L12 13.4a1 1 0 0 1-1.4 0Zm2.8-2.8a1 1 0 0 1 0 1.4l-3.5 3.5a3 3 0 1 1-4.2-4.2l1.8-1.8a1 1 0 1 1 1.4 1.4l-1.8 1.8a1 1 0 1 0 1.4 1.4L12 10.6a1 1 0 0 1 1.4 0Z"/></svg>
            </button>

            <button id="toggle-toolbar-btn" class="icon-btn" type="button" title="Show toolbar (T)" aria-label="Show toolbar" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2Zm0 5h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2Zm0 5h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2Z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <div id="flipbook" class="hide-toolbar">
            <div class="status">Loading…</div>
        </div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <noscript>
        <p class="status">This flipbook needs JavaScript. Please enable it, or open the PDFs in the <code>data</code> folder directly.</p>
    </noscript>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        var DFLIP = DFLIP || {};
        DFLIP.defaults = {
            basePath: "https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/"
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
